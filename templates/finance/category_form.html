{% extends "base.html" %}
{% block title %}{% if form.instance.pk %}Edit category{% else %}New category{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">{% if form.instance.pk %}Edit category{% else %}New category{% endif %}</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "finance/_form.html" %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'category_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
